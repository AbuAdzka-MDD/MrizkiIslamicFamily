name: PWA Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check app
        run: node --check src/app.js

      - name: Syntax check logic
        run: node --check src/logic.mjs

      - name: Run unit tests
        run: node tests/logic.test.mjs
